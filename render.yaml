# Render Blueprint — sobe o backend (Docker) + Postgres com um clique em
# "New > Blueprint" no dashboard do Render, apontando pra este repositório.
#
# O que NÃO vem daqui (tem que ser preenchido manualmente no dashboard do
# Render depois do primeiro deploy, em Environment): ALLOWED_ORIGINS,
# FRONTEND_URL, BACKEND_URL, MP_ACCESS_TOKEN, MP_WEBHOOK_SECRET,
# CLOUDINARY_*, RESEND_API_KEY, EMAIL_FROM. Ver docs/DEPLOY.md.

databases:
  - name: ecommerce-db
    databaseName: ecommerce_db
    user: ecommerce_user
    plan: free
    region: oregon

services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      # Off by default — liga só se quiser popular um catálogo de exemplo
      # nesse deploy específico (nunca num ambiente com dados reais de cliente).
      - key: SEED_DB
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_URL
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
